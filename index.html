  <style>
/* PART 3 - CART STYLING */
.cart-panel {
  display: none;
  position: fixed;
  top: 0;
  right: 0;
  width: 380px;
  max-width: 100%;
  height: 100vh;
  background: #111;
  color: #fff;
  z-index: 9999;
  box-shadow: -5px 0 20px rgba(0,0,0,0.5);
  padding: 20px;
  box-sizing: border-box;
}

.cart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #c9a227;
  padding-bottom: 15px;
}

.cart-header h2 {
  color: #d4af37;
  margin: 0;
}

.close-cart {
  background: none;
  border: none;
  color: #d4af37;
  font-size: 32px;
  cursor: pointer;
}

.cart-items {
  padding: 20px 0;
  height: calc(100vh - 190px);
  overflow-y: auto;
}

.empty-cart {
  text-align: center;
  color: #aaa;
  margin-top: 40px;
}

.cart-footer {
  border-top: 1px solid #444;
  padding-top: 15px;
}

.cart-total {
  display: flex;
  justify-content: space-between;
  font-size: 18px;
  margin-bottom: 15px;
}

.cart-total strong {
  color: #d4af37;
}

.checkout-btn {
  width: 100%;
  padding: 13px;
  background: #d4af37;
  color: #111;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}
  </style>

.top-header{

.header-row{

@media(max-width:700px){
.top-header{padding:12px}
.header-row{flex-wrap:wrap}
.logo{font-size:23px;order:1}
.menu-btn{order:2}
.icon-btn{order:3}
.login-btn{order:4}
.search-box{order:5;flex-basis:100%}
.categories{
gap:10px 16px;
font-size:14px;

}
</style>
